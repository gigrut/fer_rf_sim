[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fer-rf-sim"
version = "0.2.0"
description = "Field-emission resonance simulation and analysis in normalized current units"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2", "scipy>=1.13", "h5py>=3.10", "joblib>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
plot = ["plotly>=5.24", "matplotlib>=3.8"]
analysis = ["pandas>=2.2", "plotly>=5.24", "matplotlib>=3.8"]
gui = ["PySide6>=6.6", "pandas>=2.2", "plotly>=5.24"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[project.scripts]
fer-sim = "fer_rf_sim.cli:main"
fer-gui = "fer_rf_sim.gui:run_gui"

[tool.setuptools]
package-dir = {"" = ".", "fer_rf_sim" = "src/fer_rf_sim"}
py-modules = [
	"FER_constant_current_simulation", "FER_basic_current_sim", "FER_sim_post_processing",
	"FER_plotter", "simulation_config", "simulation_service", "simulation_repository",
	"artifact_provenance", "lut_repository", "h5_utilities", "constant_current_analysis",
	"quick_check", "run_workflow", "manage_luts", "transmission_plotting", "plot_transmission",
	"real_data_service", "peak_analysis_service", "fer_sim_config", "gui_app"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_math_fixes.py"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src/fer_rf_sim"]
typeCheckingMode = "basic"